[workspace]
resolver = "2"
members = ["frequency-limit-policy"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kunal-drall/policywright"
version = "0.1.0"

[workspace.dependencies]
# Pinned exactly per docs/FACTS.md §1.1: OpenZeppelin stellar-contracts v0.7.2
# pins soroban-sdk 26.1.0; compiling against OZ v0.7.2 means using 26.1.0.
soroban-sdk = "=26.1.0"
stellar-accounts = "=0.7.2"

# Mirrors the OZ stellar-contracts v0.7.2 workspace release profile.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
